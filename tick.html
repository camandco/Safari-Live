<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safari Tick</title>
<meta name="theme-color" content="#2A1A10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safari Tick">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/dmserif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<style>
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#hdr{background:var(--sunset);color:var(--on-board);padding:12px 14px 12px}
.tally{display:flex;align-items:baseline;gap:8px}
.tally b{font-family:var(--display);font-size:40px;line-height:.9;color:#fff;font-variant-numeric:tabular-nums}
.tally span{font-size:15px;color:var(--on-board-muted)}
.me{margin-left:auto;align-self:center;font-size:14px;font-weight:600;background:rgba(255,255,255,.1);border:0;color:var(--on-board);border-radius:12px;padding:8px 12px}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--hi);border-radius:3px;transition:width .5s ease}
.status{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;min-height:32px}
.dot{width:10px;height:10px;border-radius:50%;background:#7FD99A;flex:none}.dot.off{background:#FFD08A}
.sync{margin-left:auto;border:0;border-radius:12px;padding:7px 14px;background:var(--on-board);color:#3E2723;font-size:14px}
.tools{padding:10px 14px 6px;display:flex;flex-direction:column;gap:8px;position:sticky;top:var(--navh,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.search{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.search:focus{border-color:var(--sign);outline:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:7px 13px;font-size:15px;font-weight:500}
.chips button.on{background:var(--bush);border-color:var(--bush);color:var(--bg);font-weight:700}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:4px}
.sel select{width:100%;min-width:0;font-size:15px;font-weight:500;padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.sel select.set{border-color:var(--bush);font-weight:700}
.grp{display:flex;justify-content:space-between;align-items:baseline;padding:18px 14px 6px;font-family:var(--display);font-size:20px}
.grp span{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.rows{background:var(--panel);border-block:1px solid var(--line)}
.sp{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 110px}
.sp:first-child{border-top:0}
.sp h3{font-size:20px;color:var(--bush)}
.sp .look{font-size:15px;margin-top:3px}
.sp .meta{font-size:14px;color:var(--muted);margin-top:3px}
.sp .meta b{font-weight:600;color:var(--ink)}
.sp .seen{font-size:14px;color:var(--ok);font-weight:600;margin-top:4px}
.sp .wait{color:var(--warn)}
.sp.is-seen h3{color:var(--muted)}
.rm{display:block;margin-top:8px;border:0;background:none;padding:4px 0;font-size:14px;font-weight:600;color:var(--bad);text-decoration:underline}
.rm.armed{background:var(--bad);color:#fff;text-decoration:none;border-radius:8px;padding:6px 12px}
.sp .btn.done{opacity:1;min-width:88px;background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--line)}
.empty{text-align:center;padding:40px 16px}
.queue{padding:6px 14px}
.queue h4{margin:18px 0 4px;font-family:var(--display);font-size:20px}
.qi{font-size:14px;padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.qi span:last-child{color:var(--muted);text-align:right}
.foot{font-size:13px;color:var(--muted);text-align:center;padding:20px 16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,calc(100% + 60px));opacity:0;visibility:hidden;transition:transform .3s,opacity .3s,visibility 0s .3s;z-index:30;background:var(--board2);color:var(--on-board);border-radius:10px;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;width:min(94vw,460px);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:15px;border-left:5px solid var(--gold)}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s,opacity .3s,visibility 0s}
.toast button{margin-left:auto;border:0;background:var(--on-board);color:#3E2723;font-weight:700;border-radius:12px;padding:8px 13px;font-size:14px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(30,20,10,.55);display:flex;align-items:flex-end;justify-content:center}
.card{background:var(--panel);width:min(100%,520px);border-radius:16px 16px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;border-top:5px solid var(--sign);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{font-size:32px}
.card p{margin:6px 0 14px;color:var(--muted);font-size:15px}
.card .gps{color:var(--ink);font-weight:600;background:var(--sunk);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.card .btn{padding:16px;font-size:18px}
.card .btn+.btn{margin-top:10px}
</style>
</head>
<body data-page="tick">
<header id="hdr">
  <div class="tally"><b id="seenN">0</b><span id="seenOf"></span><button class="me" id="me">…</button></div>
  <div class="meter"><i id="meter"></i></div>
  <div class="status"><span class="dot" id="dot"></span><span id="net">Checking…</span><button class="sync" id="syncBtn">Sync now</button></div>
</header>

<div class="tools" id="tools">
  <input class="search" id="q" type="search" placeholder="Search by name or looks, like red bill" autocomplete="off" aria-label="Search animals and birds">
  <div class="chips" id="chips">
    <button data-f="all" class="on">All</button><button data-f="todo">Not seen yet</button><button data-f="Mammals">Mammals</button><button data-f="Birds">Birds</button><button data-f="Reptiles">Reptiles</button><button data-f="big5">Big Five</button>
  </div>
  <div class="sel">
    <select id="fRar" aria-label="Filter by rarity"><option value="">Any rarity</option><option>Very Common</option><option>Common</option><option>Fairly Common</option><option>Uncommon</option><option>Rare</option><option>Very Rare</option><option value="rare+">All rare finds</option></select>
    <select id="fCat" aria-label="Filter by group"><option value="">Any group</option></select>
  </div>
</div>

<div class="list" id="list"></div>

<div class="queue" id="queue"></div>
<p class="foot">Sightings are saved on this phone first, then sent to the group when there is signal. <span id="ver"></span></p>

<div class="toast" id="toast" role="status"><span id="toastT"></span><button id="undo">Undo</button></div>

<div class="sheet" id="confirm" hidden>
  <div class="card">
    <h2 id="cName"></h2>
    <p id="cSub"></p>
    <p class="gps" id="cGps">Getting your location…</p>
    <button class="btn wide" id="cYes">Seen it</button>
    <button class="btn wide alt" id="cNo">Cancel</button>
  </div>
</div>

<script src="common.js"></script>
<script>

const LOG_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTotl03LZgv5wXlVOdvTyVfAuV8-SBGbSiKh4qgMMcCRGJbKgHIKiyuXwOh6kTGwUXQ2FarxInyJath/pub?gid=900010&single=true&output=csv';
const NAMES = ['Cam', 'Melissa', 'Keegan', 'Mark', 'Tracy'];
const SPECIES = [["Kruger Mammals", "Lion", "Common", "Big Five", "Open grassland and savanna, prides rest near water in the heat", "Big tawny cat. Males have a shaggy mane; both have a black tuft on the tail tip."], ["Kruger Mammals", "Elephant", "Common", "Big Five", "Widespread near water and mopane woodland", "Huge and grey, with big flapping ears, a long trunk and white tusks."], ["Kruger Mammals", "Buffalo", "Common", "Big Five", "Grassland near permanent water, moves in large herds", "Heavy, dark cattle-like animal. Thick horns curve out and meet in a boss on the forehead."], ["Kruger Mammals", "Black-backed Jackal", "Common", "Other Predators", "Widespread, opportunistic scavenger and hunter", "Fox-sized, rusty body with a black and silver saddle on the back and a bushy black-tipped tail."], ["Kruger Mammals", "Kudu", "Common", "Antelope & Grazers", "Thick bush and woodland", "Tall grey-brown antelope with thin white stripes down the sides. Males have long spiral horns."], ["Kruger Mammals", "Waterbuck", "Common", "Antelope & Grazers", "Close to water, rarely far from rivers", "Shaggy grey-brown antelope with a white ring on the rump, like a toilet seat."], ["Kruger Mammals", "Wildebeest (Blue)", "Common", "Antelope & Grazers", "Open grassland, often alongside zebra", "Dark grey with a black face, mane and beard, high shoulders and cow-like horns."], ["Kruger Mammals", "Zebra (Burchell's)", "Common", "Antelope & Grazers", "Open grassland", "Black and white striped horse, with faint brown shadow stripes between the black ones."], ["Kruger Mammals", "Warthog", "Common", "Antelope & Grazers", "Open grassland, shelters in old burrows", "Grey pig with warts and curved tusks on the face. Runs with its thin tail straight up."], ["Kruger Mammals", "Giraffe", "Common", "Giants & Others", "Open woodland", "Unmistakable: very long neck and legs, brown patches on a cream coat."], ["Kruger Mammals", "Hippopotamus", "Common", "Giants & Others", "Rivers and dams", "Huge grey-pink barrel body, short legs and a wide mouth. Usually just eyes, ears and nostrils above water."], ["Kruger Mammals", "Baboon (Chacma)", "Common", "Giants & Others", "Widespread, troops near water and cliffs", "Large grey-brown monkey with a long dog-like face. Tail is held up, then bends down as if broken."], ["Kruger Mammals", "Vervet Monkey", "Common", "Giants & Others", "Woodland near camps and rivers", "Small grey monkey with a black face framed in white fur. Males have bright blue parts."], ["Kruger Mammals", "Mongoose (various)", "Common", "Giants & Others", "Widespread, banded mongoose live in troops", "Small, long and low. Banded has stripes across the back; dwarf is tiny and dark brown; slender has a black tail tip."], ["Kruger Mammals", "Tree Squirrel", "Common", "Giants & Others", "Woodland", "Small grey-brown squirrel with a bushy tail that it flicks when alarmed."], ["Kruger Mammals", "Rhino (White)", "Fairly Common", "Big Five", "Open grassland, grazes with head down", "Huge grey rhino with a wide, square mouth, a long head held low and a hump on the neck."], ["Kruger Mammals", "Spotted Hyena", "Fairly Common", "Other Predators", "Widespread, dens often near water", "Dog-like with a sloping back, big rounded ears and dark spots on a sandy coat."], ["Kruger Mammals", "Nyala", "Fairly Common", "Antelope & Grazers", "Dense riverine thicket, southern Kruger", "Male is dark shaggy grey with yellow legs and white stripes. Female is bright chestnut with white stripes, no horns."], ["Kruger Mammals", "Steenbok", "Fairly Common", "Antelope & Grazers", "Open grassland, usually solitary", "Small, slim, brick-red antelope with huge ears. Males have short straight horns."], ["Kruger Mammals", "Rhino (Black)", "Rare", "Big Five", "Denser bush, browses on twigs and leaves", "Smaller than white rhino, with a pointed, hooked upper lip and head held high. No neck hump."], ["Kruger Mammals", "Brown Hyena", "Rare", "Other Predators", "Drier, remote areas, mostly nocturnal", "Shaggy dark brown coat, pointed ears, pale mane on the neck and striped legs."], ["Kruger Mammals", "African Wild Dog", "Rare", "Other Predators", "Wide-ranging, uses dens for pups in denning season", "Lean dog with blotches of black, tan and white, big round ears and a white tail tip."], ["Kruger Mammals", "Caracal", "Rare", "Other Predators", "Rocky, dry areas with dense cover", "Plain reddish-tan cat with long black tufts on pointed ears and a short tail."], ["Kruger Mammals", "Serval", "Rare", "Other Predators", "Tall grassland near water", "Slender, long-legged spotted cat with very large ears and a short ringed tail."], ["Kruger Mammals", "African Wildcat", "Rare", "Other Predators", "Widespread, mostly nocturnal", "Like a pale grey tabby house cat, but with longer legs and reddish backs to the ears."], ["Kruger Mammals", "Civet", "Rare", "Other Predators", "Dense bush, nocturnal", "Stocky and low, grey with black spots and bands, a black eye-mask and a ringed tail."], ["Kruger Mammals", "Sable Antelope", "Rare", "Antelope & Grazers", "Broad-leaved woodland, central/northern Kruger", "Glossy black (females dark brown) with a white belly and face stripes. Long horns sweep back in a curve."], ["Kruger Mammals", "Roan Antelope", "Rare", "Antelope & Grazers", "Open woodland, northern Kruger", "Big, grey-tan and horse-like, with a black and white face mask and long tufted ears."], ["Kruger Mammals", "Samango Monkey", "Rare", "Giants & Others", "Forest riverine areas, far north only", "Dark grey monkey with black legs and shoulders and a pale throat. Darker and bigger than a vervet."], ["Kruger Mammals", "Bushpig", "Rare", "Giants & Others", "Dense bush, nocturnal", "Hairy reddish-brown pig with a pale mane along the back and a whitish face."], ["Kruger Mammals", "Leopard", "Uncommon", "Big Five", "Riverine woodland and rocky outcrops, often draped over branches", "Powerful cat covered in black rosettes (rings), with a long tail tipped white underneath."], Uncommon", "Giants & Others", "Burrows, widespread, nocturnal", "Large rodent covered in long black and white quills that rattle as it walks."], ["Kruger Mammals", "Bat-eared Fox", "Uncommon", "Giants & Others", "Open grassland", "Small silver-grey fox with enormous ears, black legs and a black mask."], ["Kruger Mammals", "Impala", "Very Common", "Antelope & Grazers", "Everywhere, especially woodland edges", "Slim red-brown antelope, paler on the sides, with a black \"M\" on the rump. Males have lyre-shaped horns."], ["Kruger Mammals", "Aardvark", "Very Rare", "Giants & Others", "Termite-rich areas, nocturnal", "Pig-sized and pale, with a long snout, long rabbit-like ears and a thick tail."], ["Kruger Mammals", "Aardwolf", "Very Rare", "Giants & Others", "Open grassland, nocturnal", "Like a small, slender striped hyena, with vertical black stripes and a mane along the back."], ["Kruger Mammals", "Pangolin", "Very Rare", "Giants & Others", "Varied habitat, extremely secretive", "Covered head to tail in large overlapping brown scales. Walks on its hind legs."], ["Kruger Birds", "Southern Ground Hornbill", "Uncommon", "Iconic / Big Birds", "Open savanna, moves in family groups", "Turkey-sized black bird with a bright red face and throat pouch. Walks on the ground."], ["Kruger Birds", "Kori Bustard", "Uncommon", "Iconic / Big Birds", "Open grassland", "Very large, upright ground bird, grey neck, brown back and a crest at the back of the head."], ["Kruger Birds", "Saddle-billed Stork", "Uncommon", "Iconic / Big Birds", "Near rivers and wetlands", "Very tall black and white stork with a red and black bill and a yellow \"saddle\" on top."], ["Kruger Birds", "Marabou Stork", "Common", "Iconic / Big Birds", "Near water and carrion sites", "Huge and hunched, with a bald pinkish head, massive bill and hanging throat pouch."], ["Kruger Birds", "African Fish Eagle", "Common", "Iconic / Big Birds", "Perched near rivers and dams", "White head, chest and tail, with a chestnut belly and black wings."], ["Kruger Birds", "Martial Eagle", "Rare", "Iconic / Big Birds", "Open woodland, wide hunting territories", "Very large eagle, dark brown head and chest, white belly with small dark spots."], ["Kruger Birds", "Bateleur", "Fairly Common", "Iconic / Big Birds", "Soaring over open country", "Black eagle with a red face and legs and a very short tail. Rocks side to side in flight."], ["Kruger Birds", "Secretarybird", "Uncommon", "Iconic / Big Birds", "Open grassland, walks rather than flies to hunt", "Tall grey bird on long legs, with black \"shorts\", a crest of quills and an orange face."], ["Kruger Birds", "Ostrich", "Uncommon", "Iconic / Big Birds", "Open, dry grassland", "Unmistakable giant bird. Males black and white, females grey-brown."], ["Kruger Birds", "Tawny Eagle", "Fairly Common", "Raptors", "Open savanna", "Plain tawny to brown eagle with feathered legs and a yellow gape that stops below the eye."], ["Kruger Birds", "Wahlberg's Eagle", "Uncommon", "Raptors", "Woodland, summer migrant", "Small, slim brown eagle with a slight crest. Long, narrow, square tail in flight."], ["Kruger Birds", "Black-chested Snake Eagle", "Fairly Common", "Raptors", "Open bush", "Black head and chest, clean white belly and big yellow eyes."], ["Kruger Birds", "Brown Snake Eagle", "Uncommon", "Raptors", "Woodland", "All dark brown with a large head, big yellow eyes and bare pale legs."], ["Kruger Birds", "Lappet-faced Vulture", "Uncommon", "Raptors", "Open savanna near carcasses", "Huge vulture with a bare pink-red head, massive bill and white \"trousers\"."], ["Kruger Birds", "White-backed Vulture", "Common", "Raptors", "Widespread, nests in tall trees", "Brown vulture with a dark face and neck. White lower back shows in flight."], ["Kruger Birds", "Hooded Vulture", "Uncommon", "Raptors", "Near camps and carcasses", "Small brown vulture with a thin bill and a bare pink face."], ["Kruger Birds", "White-headed Vulture", "Rare", "Raptors", "Woodland", "White hea let fRar = ''; let fCat = '';
function render() {
  $('me').textContent = me ? 'Switch person' : 'Sign in';
  const q = $('q').value.trim().toLowerCase();
  const pending = new Map(queue.map((i) => [key(i.tab, i.species), i]));
  const got = SPECIES.filter(([tab, sp]) => server[key(tab, sp)] || pending.has(key(tab, sp))).length;
  $('seenN').textContent = got; $('seenOf').textContent = `of ${SPECIES.length} species seen`; $('meter').style.width = (got / SPECIES.length) * 100 + '%';
  const rows = SPECIES.filter(([tab, sp, rar, cat, , look]) => (filter === 'all' || (filter === 'Mammals' && tab.endsWith('Mammals')) || (filter === 'Birds' && tab.endsWith('Birds')) || (filter === 'Reptiles' && tab.endsWith('Reptiles')) || (filter === 'big5' && cat === 'Big Five') || (filter === 'todo' && !server[key(tab, sp)] && !pending.has(key(tab, sp))))
    && (!fRar || rar === fRar || (fRar === 'rare+' && (rar === 'Rare' || rar === 'Very Rare'))) && (!fCat || cat === fCat)
    && (!q || sp.toLowerCase().includes(q) || cat.toLowerCase().includes(q) || (look || '').toLowerCase().includes(q)))
    .sort((a, b) => (RANK[a[2]] || 9) - (RANK[b[2]] || 9) || a[1].localeCompare(b[1]));
  const list = document.createDocumentFragment();
  if (!rows.length) list.appendChild(el('div', 'empty', q || fRar || fCat ? 'No species match. Try clearing the search or the dropdowns.' : filter === 'todo' ? 'Everything here has been seen. Nice spotting!' : 'Nothing in this list.'));
  let box = null; let last = null;
  rows.forEach(([tab, sp, rar, cat, where, look]) => {
    if (rar !== last) {
      last = rar; const n = rows.filter((r) => r[2] === rar).length;
      const g = el('div', 'grp ' + rcls(rar), rar); g.appendChild(el('span', null, `${n} species`)); list.appendChild(g);
      box = el('div', 'rows'); list.appendChild(box);
    }
    const s = server[key(tab, sp)]; const p = pending.get(key(tab, sp));
    const card = el('div', 'sp' + (s || p ? ' is-seen' : ''));
    const info = el('div');
    info.appendChild(el('h3', null, sp));
    const meta = el('div', 'meta'); meta.append(el('b', null, tab.endsWith('Birds') ? 'Bird' : tab.endsWith('Reptiles') ? 'Reptile' : 'Mammal'), ' ' + where.charAt(0).toLowerCase() + where.slice(1));
    if (look) info.appendChild(el('div', 'look', look));
    info.appendChild(meta);
    if (s) {
      info.appendChild(el('div', 'seen', `${s.who || 'Seen'}${s.when ? ', ' + s.when : ''}`));
      if (me === ADMIN) { const rm = el('button', 'rm', 'Remove this sighting'); let armed = false; rm.onclick = () => { if (!armed) { armed = true; rm.textContent = 'Tap again to remove'; rm.classList.add('armed'); setTimeout(() => { if (rm.isConnected) { armed = false; rm.textContent = 'Remove this sighting'; rm.classList.remove('armed'); } }, 4000); } else removeSighting(tab, sp, rm); }; info.appendChild(rm); }
    }
    else if (p) info.appendChild(el('div', 'seen wait', `Waiting to sync. ${p.who}, ${fmt(p.ts)}`));
    const b = el('button', 'btn' + (s || p ? ' done' : ''), s || p ? '✓ Seen' : 'Seen it');
    if (!s && !p) b.onclick = () => ask(tab, sp, rar); else b.disabled = true;
    card.append(info, b); box.appendChild(card);
  });
  $('list').replaceChildren(list);
  renderQueue();
}
const rcls = (r) => ({ 'Very Common': 'r-common', Common: 'r-common', 'Fairly Common': 'r-common', Uncommon: 'r-unc', Occasional: 'r-unc', Rare: 'r-rare', 'Very Rare': 'r-vrare' }[r] || 'r-none');
function renderQueue() {
  const box = $('queue'); box.replaceChildren();
  if (!queue.length) return;
  box.appendChild(el('h4', null, `Waiting to sync (${queue.length})`));
  queue.slice().reverse().forEach((i) => { const r = el('div', 'qi'); r.append(el('span', null, i.species), el('span', null, `${i.who}, ${fmt(i.ts)}${i.lat ? ', with GPS' : ''}`)); box.appendChild(r); });
}

/* ---------- ticking ---------- */
let fix = null; let watch = null;
function ask(tab, sp, rar) {
  if (!me || !code) { window.SafariAuth && SafariAuth.switchUser(); return; }
  $('cName').textContent = sp;
  $('cSub').textContent = `${rar}. Spotted by ${me}.`;
  $('cGps').textContent = 'Getting your location…';
  fix = null;
  if ('geolocation' in navigator) {
    watch = navigator.geolocation.watchPosition((p) => { fix = p.coords; $('cGps').textContent = `Location found, within ${Math.round(p.coords.accuracy)} m`; },
      () => { $('cGps').textContent = 'No location (allow location access to add GPS). You can still save it.'; },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  } else $('cGps').textContent = 'This phone can\'t share location. You can still save it.';
  $('cYes').onclick = () => save(tab, sp);
  $('confirm').hidden = false;
}
function closeConfirm() { $('confirm').hidden = true; if (watch != null) navigator.geolocation.clearWatch(watch); watch = null; }
function save(tab, sp) {
  const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tab, species: sp, who: me, ts: Date.now() };
  if (fix) { item.lat = +fix.latitude.toFixed(6); item.lng = +fix.longitude.toFixed(6); item.acc = Math.round(fix.accuracy); }
  queue.push(item); persist(); keepStorage(); closeConfirm(); lastSaved = item.id;
  toast(`${sp} saved${item.lat ? ' with GPS' : ''}. ${navigator.onLine ? 'Syncing…' : 'Will sync when you have signal.'}`);
  render(); sync();
}
function persist() { if (!ls.set('queue', queue)) toast('Could not save on this phone. Check storage space.'); }
let tt; function toast(t) { $('toastT').textContent = t; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 6000); }
$('undo').onclick = () => { const i = queue.findIndex((x) => x.id === lastSaved); if (i >= 0) { queue.splice(i, 1); persist(); render(); toast('Removed.'); } else toast('Already synced, so it can only be unticked in the sheet.'); };
$('cNo').onclick = closeConfirm;

/* ---------- sync ---------- */
let syncing = false; let syncMsg = '';
const VERSION = 'v25';
async function sync(manual) {
  updateNet();
  if (!navigator.onLine) { if (manual) toast('No signal right now. Your ticks are safe on this phone.'); return; }
  if (syncing) return;
  if (manual) toast(queue.length ? 'Syncing…' : 'Checking for new sightings…');
  syncing = true;
  try {
    if (queue.length) {
      if (!SCRIPT_URL.startsWith('https://')) { syncMsg = 'Sync not set up yet'; return; }
      const batch = queue.slice(0, 50);
      let res;
      try { res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ code, items: batch }), redirect: 'follow' }); }
      catch (e) { throw new Error('Could not reach the sync script (network or permissions)'); }
      const text = await res.text(); let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error(/<html/i.test(text) ? 'Sync script asked for a sign-in. Its access must be set to Anyone.' : 'Unexpected reply from the sync script'); }
      if (!data.ok) throw new Error(data.error === 'bad_code' ? 'Trip code is wrong. Tap your name to fix it.' : 'Sync script error: ' + (data.error || 'unknown'));
      syncMsg = '';
      const done = new Set(data.results.filter((r) => ['saved', 'already', 'not_found', 'bad_tab', 'bad_name'].includes(r.status)).map((r) => r.id));
      queue = queue.filter((i) => !done.has(i.id)); persist();
      const n = data.results.filter((r) => r.status === 'saved').length;
      const dup = data.results.filter((r) => r.status === 'already').map((r) => (batch.find((i) => i.id === r.id) || {}).species).filter(Boolean);
      if (dup.length) setTimeout(() => toast(`${dup.join(', ')} ${dup.length === 1 ? 'was' : 'were'} already ticked by someone else, so the first sighting was kept.`), n ? 3500 : 0);
      if (n) toast(`${n} sighting${n === 1 ? '' : 's'} synced to the group.`);
      if (queue.length) setTimeout(sync, 1500);
    }
    await pull();
  } catch (e) {
    syncMsg = e.message || 'Sync failed';
    if (manual) toast(syncMsg);
  } finally { syncing = false; updateNet(); render(); }
}
// Cam only: take a wrong sighting off the checklist for everyone.
const ADMIN = 'Cam'; let removed = ls.get('removed', {});
async function removeSighting(tab, sp, btn) {
  if (!navigator.onLine) { toast('Removing a sighting needs signal. Try again at camp.'); return; }
  btn.disabled = true; btn.textContent = 'Removing…';
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ code, action: 'remove', who: me, tab, species: sp }), redirect: 'follow' });
    const d = await res.json();
    if (d.ok && !d.removed) throw new Error('The sync script needs updating first. Paste in the latest Code.gs and deploy a new version.');
    if (!d.ok) throw new Error(d.error === 'admin_only' ? 'Only Cam can remove sightings.' : d.error === 'not_found' ? 'That species is not on the sheet.' : /bad_tab|Unexpected/.test(d.error || '') || !d.error ? 'The sync script needs updating. Paste in the latest Code.gs and deploy a new version.' : d.error);
    delete server[key(tab, sp)]; ls.set('server', server); removed[key(tab, sp)] = Date.now(); ls.set('removed', removed);
    toast(`${sp} removed. Anyone can log it again.`); render();
  } catch (e) { toast('Could not remove it: ' + (e.message.includes('JSON') || e.message === 'Failed to fetch' ? 'the sync script needs updating or there is no signal.' : e.message)); render(); }
}
async function pull() {
  const res = await fetch(LOG_CSV + '&t=' + Date.now()); if (!res.ok) return;
  const rows = parse(await res.text()).slice(1).filter((r) => r[4]);
  const map = {}; rows.forEach((r) => { const tab = `${r[3]} ${r[8] === 'Bird' ? 'Birds' : r[8] === 'Reptile' ? 'Reptiles' : 'Mammals'}`; map[key(tab, r[4])] = { who: r[2], when: `${r[0]} ${r[1]}`.trim() }; });
  // the published sheet lags a few minutes, so keep just-removed sightings hidden until it catches up
  Object.keys(removed).forEach((k) => { if (Date.now() - removed[k] > 15 * 60000) delete removed[k]; else delete map[k]; }); ls.set('removed', removed);
  server = map; ls.set('server', server); ls.set('pulledAt', Date.now());
}
function parse(text) { const rows = []; let row = []; let cell = ''; let q = false; for (let i = 0; i < text.length; i++) { const c = text[i]; if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; } else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else if (c !== '\r') cell += c; } if (cell || row.length) { row.push(cell); rows.push(row); } return rows; }
function updateNet() {
  const on = navigator.onLine; $('dot').classList.toggle('off', !on);
  const w = queue.length ? `, ${queue.length} waiting to sync` : '';
  $('net').textContent = (on ? 'Online' : 'No signal, saving on this phone') + w + (on && queue.length && syncMsg ? `. ${syncMsg}` : '');
  $('syncBtn').hidden = !on;
}
$('syncBtn').onclick = () => sync(true);
addEventListener('online', () => sync()); addEventListener('offline', updateNet);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => sync(), 60000);

/* ---------- login (shared with the dashboard, see common.js) ---------- */
$('me').onclick = () => window.SafariAuth && SafariAuth.switchUser();
addEventListener('safari-login', () => { me = ls.get('me', ''); code = ls.get('code', ''); render(); sync(); });

/* ---------- controls ---------- */
$('chips').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; $('chips').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); };
$('q').oninput = render;
[...new Set(SPECIES.map((s) => s[3]))].sort().forEach((c) => { const o = document.createElement('option'); o.textContent = c; $('fCat').appendChild(o); });
$('fRar').onchange = (e) => { fRar = e.target.value; e.target.classList.toggle('set', !!fRar); render(); scrollTo(0, 0); };
$('fCat').onchange = (e) => { fCat = e.target.value; e.target.classList.toggle('set', !!fCat); render(); scrollTo(0, 0); };
const setHH = () => document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px'); addEventListener('resize', setHH);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Ask the phone not to clear this app's saved ticks when space runs low
const keepStorage = () => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then((ok) => { if (!ok) navigator.storage.persist(); }).catch(() => {}); } catch (e) {} };
keepStorage();
$('ver').textContent = 'Version ' + VERSION.slice(1) + '.'; setHH(); render(); sync();
</script>
