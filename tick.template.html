<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safari Tick</title>
<meta name="theme-color" content="#132A1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Safari Tick">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/barlowc-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<style>
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#hdr{background:var(--board);color:var(--on-board);padding:12px 14px 12px}
.tally{display:flex;align-items:baseline;gap:8px}
.tally b{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;color:var(--sign);font-variant-numeric:tabular-nums}
.tally span{font-size:15px;color:var(--on-board-muted)}
.me{margin-left:auto;align-self:center;font-size:14px;font-weight:600;background:rgba(255,255,255,.1);border:0;color:var(--on-board);border-radius:8px;padding:8px 12px}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--sign);border-radius:3px;transition:width .5s ease}
.status{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;min-height:32px}
.dot{width:10px;height:10px;border-radius:50%;background:#7FD99A;flex:none}.dot.off{background:var(--sign)}
.sync{margin-left:auto;border:0;border-radius:8px;padding:7px 14px;background:var(--on-board);color:#15241B;font-weight:700;font-size:14px}
.tools{padding:10px 14px 6px;display:flex;flex-direction:column;gap:8px;position:sticky;top:var(--navh,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.search{width:100%;font-size:17px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.search:focus{border-color:var(--board);outline:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 13px;font-size:15px;font-weight:500}
.chips button.on{background:var(--board);border-color:var(--board);color:var(--sign);font-weight:700}
.grp{display:flex;justify-content:space-between;align-items:baseline;padding:18px 14px 6px;font-family:var(--display);font-weight:700;font-size:20px}
.grp span{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.rows{background:var(--panel);border-block:1px solid var(--line)}
.sp{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 72px}
.sp:first-child{border-top:0}
.sp h3{font-size:22px;font-weight:600}
.sp .meta{font-size:14px;color:var(--muted);margin-top:3px}
.sp .meta b{font-weight:600;color:var(--ink)}
.sp .seen{font-size:14px;color:var(--ok);font-weight:600;margin-top:4px}
.sp .wait{color:var(--warn)}
.sp.is-seen h3{color:var(--muted)}
.sp .btn.done{opacity:1;min-width:88px;background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--line)}
.empty{text-align:center;padding:40px 16px}
.queue{padding:6px 14px}
.queue h4{margin:18px 0 4px;font-family:var(--display);font-size:20px}
.qi{font-size:14px;padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.qi span:last-child{color:var(--muted);text-align:right}
.foot{font-size:13px;color:var(--muted);text-align:center;padding:20px 16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,calc(100% + 60px));opacity:0;visibility:hidden;transition:transform .3s,opacity .3s,visibility 0s .3s;z-index:30;background:var(--board2);color:var(--on-board);border-radius:10px;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;width:min(94vw,460px);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:15px;border-left:5px solid var(--sign)}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s,opacity .3s,visibility 0s}
.toast button{margin-left:auto;border:0;background:var(--on-board);color:#15241B;font-weight:700;border-radius:8px;padding:8px 13px;font-size:14px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,16,11,.6);display:flex;align-items:flex-end;justify-content:center}
.card{background:var(--panel);width:min(100%,520px);border-radius:16px 16px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;border-top:5px solid var(--sign);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{font-size:38px}
.card p{margin:6px 0 14px;color:var(--muted);font-size:15px}
.card .gps{color:var(--ink);font-weight:600;background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0 0 14px}
.card .btn{padding:16px;font-size:18px}
.card .btn+.btn{margin-top:10px}
</style>
</head>
<body data-page="tick">
<header id="hdr">
  <div class="tally"><b id="seenN">0</b><span id="seenOf"></span><button class="me" id="me">…</button></div>
  <div class="meter"><i id="meter"></i></div>
  <div class="status"><span class="dot" id="dot"></span><span id="net">Checking…</span><button class="sync" id="syncBtn">Sync now</button></div>
</header>

<div class="tools" id="tools">
  <input class="search" id="q" type="search" placeholder="Search animals and birds" autocomplete="off" aria-label="Search animals and birds">
  <div class="chips" id="chips">
    <button data-f="all" class="on">All</button><button data-f="todo">Not seen yet</button><button data-f="Mammals">Mammals</button><button data-f="Birds">Birds</button><button data-f="Reptiles">Reptiles</button><button data-f="big5">Big Five</button>
  </div>
</div>

<div class="list" id="list"></div>

<div class="queue" id="queue"></div>
<p class="foot">Sightings are saved on this phone first, then sent to the group when there is signal. <span id="ver"></span></p>

<div class="toast" id="toast" role="status"><span id="toastT"></span><button id="undo">Undo</button></div>

<div class="sheet" id="confirm" hidden>
  <div class="card">
    <h2 id="cName"></h2>
    <p id="cSub"></p>
    <p class="gps" id="cGps">Getting your location…</p>
    <button class="btn wide" id="cYes">Seen it</button>
    <button class="btn wide alt" id="cNo">Cancel</button>
  </div>
</div>

<script src="common.js"></script>
<script>
const SCRIPT_URL = '__SCRIPT_URL__';
const LOG_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTotl03LZgv5wXlVOdvTyVfAuV8-SBGbSiKh4qgMMcCRGJbKgHIKiyuXwOh6kTGwUXQ2FarxInyJath/pub?gid=900010&single=true&output=csv';
const NAMES = ['Cam', 'Melissa', 'Keegan', 'Mark', 'Tracy'];
const SPECIES = __SPECIES__;
const RANK = { 'Very Common': 1, Common: 2, 'Fairly Common': 3, Uncommon: 4, Occasional: 5, Rare: 6, 'Very Rare': 7, 'Not typically present': 8 };

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } } };

let me = ls.get('me', ''); let code = ls.get('code', ''); const park = 'Kruger';
let queue = ls.get('queue', []); let server = ls.get('server', {}); let filter = 'all'; let lastSaved = null;

const parkOf = (tab) => tab.split(' ')[0];
const key = (tab, sp) => tab + '|' + sp;
const fmt = (ts) => new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Johannesburg' });
const pillCls = (r) => ({ 'Very Common': 'c', Common: 'c', 'Fairly Common': 'c', Uncommon: 'u', Occasional: 'u', Rare: 'r', 'Very Rare': 'v' }[r] || '');

/* ---------- list ---------- */
function render() {
  $('me').textContent = me ? 'Switch person' : 'Sign in';
  const q = $('q').value.trim().toLowerCase();
  const pending = new Map(queue.map((i) => [key(i.tab, i.species), i]));
  const got = SPECIES.filter(([tab, sp]) => server[key(tab, sp)] || pending.has(key(tab, sp))).length;
  $('seenN').textContent = got; $('seenOf').textContent = `of ${SPECIES.length} species seen`; $('meter').style.width = (got / SPECIES.length) * 100 + '%';
  const rows = SPECIES.filter(([tab, sp, rar, cat]) => (filter === 'all' || (filter === 'Mammals' && tab.endsWith('Mammals')) || (filter === 'Birds' && tab.endsWith('Birds')) || (filter === 'Reptiles' && tab.endsWith('Reptiles')) || (filter === 'big5' && cat === 'Big Five') || (filter === 'todo' && !server[key(tab, sp)] && !pending.has(key(tab, sp))))
    && (!q || sp.toLowerCase().includes(q) || cat.toLowerCase().includes(q)))
    .sort((a, b) => (RANK[a[2]] || 9) - (RANK[b[2]] || 9) || a[1].localeCompare(b[1]));
  const list = document.createDocumentFragment();
  if (!rows.length) list.appendChild(el('div', 'empty', q ? 'No species match that search.' : filter === 'todo' ? 'Everything here has been seen. Nice spotting!' : 'Nothing in this list.'));
  let box = null; let last = null;
  rows.forEach(([tab, sp, rar, cat, where]) => {
    if (rar !== last) {
      last = rar; const n = rows.filter((r) => r[2] === rar).length;
      const g = el('div', 'grp ' + rcls(rar), rar); g.appendChild(el('span', null, `${n} species`)); list.appendChild(g);
      box = el('div', 'rows'); list.appendChild(box);
    }
    const s = server[key(tab, sp)]; const p = pending.get(key(tab, sp));
    const card = el('div', 'sp' + (s || p ? ' is-seen' : ''));
    const info = el('div');
    info.appendChild(el('h3', null, sp));
    const meta = el('div', 'meta'); meta.append(el('b', null, tab.endsWith('Birds') ? 'Bird' : tab.endsWith('Reptiles') ? 'Reptile' : 'Mammal'), ' ' + where.charAt(0).toLowerCase() + where.slice(1));
    info.appendChild(meta);
    if (s) info.appendChild(el('div', 'seen', `${s.who || 'Seen'}${s.when ? ', ' + s.when : ''}`));
    else if (p) info.appendChild(el('div', 'seen wait', `Waiting to sync. ${p.who}, ${fmt(p.ts)}`));
    const b = el('button', 'btn' + (s || p ? ' done' : ''), s || p ? '✓ Seen' : 'Seen it');
    if (!s && !p) b.onclick = () => ask(tab, sp, rar); else b.disabled = true;
    card.append(info, b); box.appendChild(card);
  });
  $('list').replaceChildren(list);
  renderQueue();
}
const rcls = (r) => ({ 'Very Common': 'r-common', Common: 'r-common', 'Fairly Common': 'r-common', Uncommon: 'r-unc', Occasional: 'r-unc', Rare: 'r-rare', 'Very Rare': 'r-vrare' }[r] || 'r-none');
function renderQueue() {
  const box = $('queue'); box.replaceChildren();
  if (!queue.length) return;
  box.appendChild(el('h4', null, `Waiting to sync (${queue.length})`));
  queue.slice().reverse().forEach((i) => { const r = el('div', 'qi'); r.append(el('span', null, i.species), el('span', null, `${i.who}, ${fmt(i.ts)}${i.lat ? ', with GPS' : ''}`)); box.appendChild(r); });
}

/* ---------- ticking ---------- */
let fix = null; let watch = null;
function ask(tab, sp, rar) {
  if (!me || !code) { window.SafariAuth && SafariAuth.switchUser(); return; }
  $('cName').textContent = sp;
  $('cSub').textContent = `${rar}. Spotted by ${me}.`;
  $('cGps').textContent = 'Getting your location…';
  fix = null;
  if ('geolocation' in navigator) {
    watch = navigator.geolocation.watchPosition((p) => { fix = p.coords; $('cGps').textContent = `Location found, within ${Math.round(p.coords.accuracy)} m`; },
      () => { $('cGps').textContent = 'No location (allow location access to add GPS). You can still save it.'; },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  } else $('cGps').textContent = 'This phone can\'t share location. You can still save it.';
  $('cYes').onclick = () => save(tab, sp);
  $('confirm').hidden = false;
}
function closeConfirm() { $('confirm').hidden = true; if (watch != null) navigator.geolocation.clearWatch(watch); watch = null; }
function save(tab, sp) {
  const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tab, species: sp, who: me, ts: Date.now() };
  if (fix) { item.lat = +fix.latitude.toFixed(6); item.lng = +fix.longitude.toFixed(6); item.acc = Math.round(fix.accuracy); }
  queue.push(item); persist(); keepStorage(); closeConfirm(); lastSaved = item.id;
  toast(`${sp} saved${item.lat ? ' with GPS' : ''}. ${navigator.onLine ? 'Syncing…' : 'Will sync when you have signal.'}`);
  render(); sync();
}
function persist() { if (!ls.set('queue', queue)) toast('Could not save on this phone. Check storage space.'); }
let tt; function toast(t) { $('toastT').textContent = t; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 6000); }
$('undo').onclick = () => { const i = queue.findIndex((x) => x.id === lastSaved); if (i >= 0) { queue.splice(i, 1); persist(); render(); toast('Removed.'); } else toast('Already synced, so it can only be unticked in the sheet.'); };
$('cNo').onclick = closeConfirm;

/* ---------- sync ---------- */
let syncing = false; let syncMsg = '';
const VERSION = 'v19';
async function sync(manual) {
  updateNet();
  if (!navigator.onLine) { if (manual) toast('No signal right now. Your ticks are safe on this phone.'); return; }
  if (syncing) return;
  if (manual) toast(queue.length ? 'Syncing…' : 'Checking for new sightings…');
  syncing = true;
  try {
    if (queue.length) {
      if (!SCRIPT_URL.startsWith('https://')) { syncMsg = 'Sync not set up yet'; return; }
      const batch = queue.slice(0, 50);
      let res;
      try { res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ code, items: batch }), redirect: 'follow' }); }
      catch (e) { throw new Error('Could not reach the sync script (network or permissions)'); }
      const text = await res.text(); let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error(/<html/i.test(text) ? 'Sync script asked for a sign-in. Its access must be set to Anyone.' : 'Unexpected reply from the sync script'); }
      if (!data.ok) throw new Error(data.error === 'bad_code' ? 'Trip code is wrong. Tap your name to fix it.' : 'Sync script error: ' + (data.error || 'unknown'));
      syncMsg = '';
      const done = new Set(data.results.filter((r) => ['saved', 'already', 'not_found', 'bad_tab', 'bad_name'].includes(r.status)).map((r) => r.id));
      queue = queue.filter((i) => !done.has(i.id)); persist();
      const n = data.results.filter((r) => r.status === 'saved').length;
      const dup = data.results.filter((r) => r.status === 'already').map((r) => (batch.find((i) => i.id === r.id) || {}).species).filter(Boolean);
      if (dup.length) setTimeout(() => toast(`${dup.join(', ')} ${dup.length === 1 ? 'was' : 'were'} already ticked by someone else, so the first sighting was kept.`), n ? 3500 : 0);
      if (n) toast(`${n} sighting${n === 1 ? '' : 's'} synced to the group.`);
      if (queue.length) setTimeout(sync, 1500);
    }
    await pull();
  } catch (e) {
    syncMsg = e.message || 'Sync failed';
    if (manual) toast(syncMsg);
  } finally { syncing = false; updateNet(); render(); }
}
async function pull() {
  const res = await fetch(LOG_CSV + '&t=' + Date.now()); if (!res.ok) return;
  const rows = parse(await res.text()).slice(1).filter((r) => r[4]);
  const map = {}; rows.forEach((r) => { const tab = `${r[3]} ${r[8] === 'Bird' ? 'Birds' : r[8] === 'Reptile' ? 'Reptiles' : 'Mammals'}`; map[key(tab, r[4])] = { who: r[2], when: `${r[0]} ${r[1]}`.trim() }; });
  server = map; ls.set('server', server); ls.set('pulledAt', Date.now());
}
function parse(text) { const rows = []; let row = []; let cell = ''; let q = false; for (let i = 0; i < text.length; i++) { const c = text[i]; if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; } else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else if (c !== '\r') cell += c; } if (cell || row.length) { row.push(cell); rows.push(row); } return rows; }
function updateNet() {
  const on = navigator.onLine; $('dot').classList.toggle('off', !on);
  const w = queue.length ? `, ${queue.length} waiting to sync` : '';
  $('net').textContent = (on ? 'Online' : 'No signal, saving on this phone') + w + (on && queue.length && syncMsg ? `. ${syncMsg}` : '');
  $('syncBtn').hidden = !on;
}
$('syncBtn').onclick = () => sync(true);
addEventListener('online', () => sync()); addEventListener('offline', updateNet);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => sync(), 60000);

/* ---------- login (shared with the dashboard, see common.js) ---------- */
$('me').onclick = () => window.SafariAuth && SafariAuth.switchUser();
addEventListener('safari-login', () => { me = ls.get('me', ''); code = ls.get('code', ''); render(); sync(); });

/* ---------- controls ---------- */
$('chips').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; $('chips').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); };
$('q').oninput = render;
const setHH = () => document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px'); addEventListener('resize', setHH);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Ask the phone not to clear this app's saved ticks when space runs low
const keepStorage = () => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then((ok) => { if (!ok) navigator.storage.persist(); }).catch(() => {}); } catch (e) {} };
keepStorage();
$('ver').textContent = 'Version ' + VERSION.slice(1) + '.'; setHH(); render(); sync();
</script>
</body>
</html>
